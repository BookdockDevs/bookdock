<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title data-i18n="app.name">书坞</title><link rel="stylesheet" href="styles.css"></head>
<body class="w-96 bg-white font-sans text-stone-900 antialiased select-none dark:bg-stone-900 dark:text-stone-100">
  <main class="p-4">
    <!-- 1. 未连接向导引导区（三态之一：Setup 模式） -->
    <div id="setup-header" hidden class="mb-4">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-stone-900 text-white shadow-2xs dark:bg-stone-100 dark:text-stone-900">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z" />
            <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5" />
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <h1 class="text-sm font-semibold tracking-tight text-stone-900 dark:text-stone-100" data-i18n="popup.accountMissing">连接你的书坞</h1>
          <p class="mt-0.5 text-xs text-stone-500 dark:text-stone-400" data-i18n="popup.instanceHint">在书坞「设置」里创建访问令牌，勾选「上传书籍」</p>
        </div>
      </div>
    </div>

    <!-- 2. 已连接实例卡片（三态之二：Launcher 模式） -->
    <div id="connection-card" hidden class="rounded-xl border border-stone-200/90 bg-stone-50/80 p-3 shadow-2xs dark:border-stone-800 dark:bg-stone-850">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-stone-200/60 text-stone-700 dark:bg-stone-750 dark:text-stone-200">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z" />
            <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5" />
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <span id="badge" hidden class="relative flex h-2 w-2 shrink-0">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
            </span>
            <p id="account" class="truncate text-sm font-semibold text-stone-900 dark:text-stone-100"></p>
          </div>
          <a id="instance" target="_blank" rel="noreferrer" class="mt-0.5 inline-flex max-w-full items-center gap-1 truncate text-xs text-stone-500 transition-colors hover:text-stone-800 hover:underline dark:text-stone-400 dark:hover:text-stone-200"></a>
        </div>
        <div class="flex items-center gap-1">
          <button id="open-instance" type="button" aria-label="打开书坞" title="在新标签页打开书坞" data-i18n-aria-label="popup.openInstanceTitle" data-i18n-title="popup.openInstanceTitle" class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-stone-400 transition-all duration-150 ease-out hover:bg-stone-200/60 hover:text-stone-700 active:scale-95 focus-visible:outline-2 focus-visible:outline-stone-400 dark:hover:bg-stone-750 dark:hover:text-stone-100">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
          <button id="edit-connection" type="button" aria-label="编辑连接" title="编辑连接" data-i18n-aria-label="popup.edit" data-i18n-title="popup.edit" class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-stone-400 transition-all duration-150 ease-out hover:bg-stone-200/60 hover:text-stone-700 active:scale-95 focus-visible:outline-2 focus-visible:outline-stone-400 dark:hover:bg-stone-750 dark:hover:text-stone-100">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 3. 连接配置表单（兼顾未连接时的输入与已连接时的编辑） -->
    <div id="connection-panel">
      <div id="editing-header" hidden class="mb-3 flex items-center justify-between">
        <span class="text-xs font-semibold tracking-wide text-stone-500" data-i18n="popup.edit">编辑连接</span>
        <button id="cancel-edit" type="button" aria-label="取消编辑" title="取消编辑" data-i18n-aria-label="popup.cancelEdit" data-i18n-title="popup.cancelEdit" class="flex h-6 w-6 items-center justify-center rounded-md text-stone-400 transition hover:bg-stone-100 hover:text-stone-600 dark:hover:bg-stone-800 dark:hover:text-stone-200">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="connection-form" class="space-y-2.5">
        <div>
          <label for="instance-url" class="mb-1 block text-xs font-medium text-stone-600 dark:text-stone-300" data-i18n="popup.urlLabel">实例地址</label>
          <input id="instance-url" type="url" required placeholder="https://books.example.com" autocomplete="url" spellcheck="false" class="w-full rounded-xl border border-stone-200 bg-stone-50/70 px-3 py-2 text-sm text-stone-800 outline-none transition focus:border-stone-400 focus:bg-white focus:ring-2 focus:ring-stone-200 dark:border-stone-700 dark:bg-stone-950 dark:text-stone-100 dark:focus:ring-stone-800">
        </div>
        <div>
          <label for="token" class="mb-1 block text-xs font-medium text-stone-600 dark:text-stone-300" data-i18n="popup.tokenLabel">访问令牌</label>
          <div class="relative">
            <input id="token" type="password" placeholder="bd_…" autocomplete="off" spellcheck="false" class="w-full rounded-xl border border-stone-200 bg-stone-50/70 px-3 py-2 pr-11 text-sm text-stone-800 outline-none transition focus:border-stone-400 focus:bg-white focus:ring-2 focus:ring-stone-200 dark:border-stone-700 dark:bg-stone-950 dark:text-stone-100 dark:focus:ring-stone-800">
            <button id="show-token" type="button" aria-pressed="false" aria-controls="token" aria-label="显示令牌" title="显示令牌" data-i18n-aria-label="popup.showToken" data-i18n-title="popup.showToken" class="absolute right-1 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg text-stone-400 transition hover:bg-stone-200/70 hover:text-stone-700 focus-visible:outline-2 focus-visible:outline-stone-400 dark:text-stone-500 dark:hover:bg-stone-800 dark:hover:text-stone-200"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button id="save" type="submit" class="mt-1 inline-flex h-10 w-full items-center justify-center font-medium tracking-tight transition-all duration-150 ease-out select-none outline-none focus-visible:ring-2 focus-visible:ring-stone-400/50 active:scale-[0.985] disabled:pointer-events-none disabled:opacity-40" data-i18n="popup.save">测试并保存</button>
        <p id="status" hidden aria-live="polite"></p>
        <div id="disconnect-row" hidden class="pt-1.5">
          <button id="disconnect" type="button" class="inline-flex w-full items-center justify-center gap-1.5 rounded-xl border border-rose-200/80 bg-rose-50/50 px-3.5 py-2 text-xs font-medium text-rose-600 shadow-2xs transition-all duration-150 ease-out hover:border-rose-300 hover:bg-rose-100/70 hover:text-rose-700 active:scale-[0.985] dark:border-rose-900/40 dark:bg-rose-950/20 dark:text-rose-400 dark:hover:bg-rose-950/50">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span data-i18n="popup.disconnect">断开当前连接</span>
          </button>
        </div>
      </form>
    </div>

    <!-- 4. 已连接时的快捷动作与开关区 -->
    <section id="connected-actions" hidden class="mt-3 border-t border-stone-100 pt-1 dark:border-stone-800">
      <label class="flex cursor-pointer items-start justify-between gap-3 py-2.5">
        <div class="min-w-0 flex-1">
          <span class="block text-sm font-medium text-stone-800 dark:text-stone-200" data-i18n="popup.acceptDrops">网页拖拽投送</span>
          <span class="mt-0.5 block text-xs text-stone-400 dark:text-stone-500" data-i18n="popup.acceptDropsHint">在任意网页拖入电子书即可快速发送</span>
        </div>
        <input id="enabled" type="checkbox" role="switch" class="peer sr-only">
        <span class="relative mt-0.5 block h-5 w-9 shrink-0 rounded-full bg-stone-200 transition-colors after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-white after:shadow-2xs after:transition-transform after:content-[''] peer-checked:bg-stone-900 peer-checked:after:translate-x-4 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-stone-400 dark:bg-stone-700 dark:after:bg-stone-900 dark:peer-checked:bg-stone-100"></span>
      </label>
      <label class="flex cursor-pointer items-start justify-between gap-3 py-2.5">
        <div class="min-w-0 flex-1">
          <span class="block text-sm font-medium text-stone-800 dark:text-stone-200" data-i18n="popup.autoOpen">完成后打开书坞</span>
          <span class="mt-0.5 block text-xs text-stone-400 dark:text-stone-500" data-i18n="popup.autoOpenHint">书籍上传成功后，自动在新标签页打开</span>
        </div>
        <input id="auto-open" type="checkbox" role="switch" class="peer sr-only">
        <span class="relative mt-0.5 block h-5 w-9 shrink-0 rounded-full bg-stone-200 transition-colors after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-white after:shadow-2xs after:transition-transform after:content-[''] peer-checked:bg-stone-900 peer-checked:after:translate-x-4 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-stone-400 dark:bg-stone-700 dark:after:bg-stone-900 dark:peer-checked:bg-stone-100"></span>
      </label>
      <div class="mt-2">
        <button id="choose-file" type="button" class="group flex h-10 w-full items-center justify-center gap-2 rounded-xl border border-stone-900/90 bg-stone-900 px-4 text-sm font-medium text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.16),0_1px_2px_rgba(0,0,0,0.12)] transition-all duration-150 ease-out select-none outline-none hover:border-stone-800 hover:bg-stone-800 active:scale-[0.985] active:bg-stone-950 focus-visible:ring-2 focus-visible:ring-stone-400/50 dark:border-white/90 dark:bg-stone-100 dark:text-stone-900 dark:shadow-[inset_0_1px_0_rgba(255,255,255,0.8),0_1px_2px_rgba(0,0,0,0.25)] dark:hover:bg-white dark:active:bg-stone-200">
          <span data-i18n="popup.chooseFile">打开上传页面</span>
          <svg class="h-4 w-4 transition-transform duration-150 group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
      <section id="jobs-section" hidden class="mt-2 border-t border-stone-100 pt-2 dark:border-stone-800"><h2 class="mb-1 text-xs font-medium text-stone-500" data-i18n="popup.jobsTitle">待处理文件</h2><div id="jobs" class="space-y-1"></div></section>
    </section>
  </main>
  <script src="popup.js" defer></script>
</body></html>
