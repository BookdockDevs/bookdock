<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>书坞</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --border: #000000;
    --muted-bg: #eeeeee;
    --muted-border: #aaaaaa;
    color-scheme: light dark;
  }
  [data-theme="dark"] {
    --bg: #000000;
    --fg: #ffffff;
    --border: #ffffff;
    --muted-bg: #1c1c1c;
    --muted-border: #555555;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --fg: #ffffff;
      --border: #ffffff;
      --muted-bg: #1c1c1c;
      --muted-border: #555555;
      color-scheme: dark;
    }
  }
  html, body, #app { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 18px sans-serif; }
  button, input {
    min-height: 48px;
    font: inherit;
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
    user-select: none;
    -webkit-user-select: none;
  }
  button:focus, button:active, button:focus-visible,
  input:focus, input:active, input:focus-visible {
    outline: none !important;
    box-shadow: none !important;
  }
  button { background: var(--bg); border: 0; color: var(--fg); }
  button:disabled { color: var(--muted-border); }
  .login { max-width: 360px; margin: 40px auto; padding: 20px; }
  .login h1 { text-align: center; }
  .login input, .login button { display: block; width: 100%; margin: 12px 0; padding: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  h1 { font-size: 24px; }
  .status { color: var(--fg); }
  .shelf { height: 100%; max-width: 960px; margin: 0 auto; padding: 24px 24px 0; overflow: hidden; }
  .shelf-header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 26px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .shelf-title-group { display: flex; min-width: 0; align-items: center; gap: 4px; }
  .logout-btn { display: flex; flex: 0 0 40px; align-items: center; justify-content: center; width: 40px; height: 40px; min-height: 40px; padding: 8px; }
  .logout-btn svg { width: 20px; height: 20px; }
  .shelf-header h1 { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 24px; }
  .theme-btn { min-width: 64px; height: 38px; min-height: 38px; padding: 4px 12px; border: 1px solid var(--border); font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); justify-content: center; align-content: start; gap: 26px 16px; align-items: start; }
  .grid.grid-balanced { align-content: space-evenly; }
  .book { align-self: start; min-width: 0; text-align: left; padding: 0; }
  .cover { position: relative; width: 100%; padding-top: 150%; margin-bottom: 9px; border: 1px solid var(--muted-border); background: var(--muted-bg); }
  .cover img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover-fallback { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; font-family: serif; color: var(--fg); }
  .cover-fallback-title { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 4; text-align: center; overflow-wrap: break-word; font-size: 13px; line-height: 1.3; }
  .book-title { display: -webkit-box; overflow: hidden; height: 2.8em; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 1.4; font-size: 16px; color: var(--fg); }
  .shelf-footer { position: fixed; right: 0; bottom: 0; left: 0; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 960px; margin: 0 auto; padding: 0 24px; border-top: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  .reader { height: calc(100% - 58px); background: var(--bg); }
  foliate-view { display: block; width: 100%; height: 100%; }
  .reader-status { display: none !important; }
  .turn-status {
    position: fixed;
    z-index: 5;
    right: 12px;
    bottom: 66px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    pointer-events: none;
  }
  .loading-overlay {
    position: fixed;
    z-index: 100;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.35);
  }
  [data-theme="dark"] .loading-overlay {
    background: rgba(0, 0, 0, 0.7);
  }
  .loading-box {
    min-width: 220px;
    max-width: 82%;
    padding: 22px 28px;
    background: var(--bg);
    color: var(--fg);
    border: 2px solid var(--border);
    text-align: center;
    box-sizing: border-box;
  }
  .loading-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .loading-text {
    font-size: 17px;
    line-height: 1.5;
  }
  .loading-actions {
    margin-top: 18px;
    display: flex;
    justify-content: center;
  }
  .loading-actions button + button { margin-left: 12px; }
  .loading-actions button {
    min-width: 84px;
    height: 40px;
    min-height: 40px;
    padding: 0 14px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: var(--bg);
    color: var(--fg);
  }
  .controls { height: 58px; display: flex; border-top: 1px solid var(--border); background: var(--bg); }
  .controls button {
    flex: 1;
    min-width: 0;
    padding: 4px;
    font-size: 16px;
    color: var(--fg);
    background: var(--bg);
    border: 0 !important;
    outline: none !important;
    box-shadow: none !important;
  }
  .controls button:focus, .controls button:active {
    outline: none !important;
    border: 0 !important;
    background: var(--bg) !important;
  }
  .backdrop { position: fixed; z-index: 1; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); }
  .panel {
    position: fixed;
    z-index: 2;
    top: 0;
    right: 0;
    bottom: 0;
    width: 75%;
    max-width: 400px;
    padding: 20px 20px 16px;
    border-left: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    overflow: hidden;
  }
  .panel header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel h2 { font-size: 22px; margin: 0; }
  .panel-header-subtitle {
    font-size: 15px;
    color: var(--fg);
    opacity: 0.75;
  }
  .panel-body {
    flex: 1;
    min-height: 0;
    overflow: hidden !important;
    display: flex;
    flex-direction: column;
    padding: 0;
  }
  .panel-body::-webkit-scrollbar,
  .toc-list::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }
  .panel-footer {
    flex-shrink: 0;
    padding-top: 12px;
    border-top: 1px solid var(--muted-border);
  }
  .toc-list {
    flex: 1;
    min-height: 0;
    overflow: hidden !important;
    display: flex;
    flex-direction: column;
  }
  .toc-row {
    position: relative;
    flex: 0 0 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0 14px;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--muted-border);
    color: var(--fg);
    background: var(--bg);
    font-size: 16px;
    line-height: 1.3;
    box-sizing: border-box;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .toc-list-fill .toc-row { flex: 1 1 0px; }
  .toc-row:disabled {
    color: var(--muted-border);
  }
  .toc-row.current {
    font-weight: bold;
    background: var(--muted-bg);
  }
  .toc-row.current::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 1px;
    left: 0;
    width: 4px;
    background: var(--fg);
    pointer-events: none;
  }
  .toc-pager {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 40px;
  }
  .toc-pager button {
    min-width: 68px;
    height: 38px;
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: var(--bg);
    color: var(--fg);
  }
  .shelf-header-actions {
    display: flex;
    flex-shrink: 0;
    gap: 8px;
  }
  .backdrop.backdrop-transparent {
    background: transparent !important;
  }
  .panel.panel-bottom {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    max-width: none;
    border-left: 0;
    border-top: 2px solid var(--border);
    padding: 16px 28px 24px;
    height: 70vh;
    min-height: 460px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .panel.panel-bottom .panel-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 16px 8px 20px;
    box-sizing: border-box;
  }
  .panel.panel-bottom .panel-body.other-settings { justify-content: flex-start; }
  .panel[aria-busy="true"] { pointer-events: none; }
  .settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    flex-shrink: 0;
  }
  .settings-tabs {
    display: flex;
    min-width: 0;
  }
  .settings-tab-btn {
    font-size: 20px;
    padding: 6px 8px;
    border: 0;
    border-bottom: 3px solid transparent;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
  }
  .settings-tab-btn + .settings-tab-btn {
    margin-left: 8px;
  }
  .settings-tab-btn.active {
    font-weight: bold;
    border-bottom: 3px solid var(--fg);
  }
  .settings-header-actions {
    display: flex;
    align-items: center;
  }
  .turn-area-group { width: 100%; }
  .turn-area-title { font-size: 17px; margin-bottom: 10px; color: var(--fg); }
  .turn-area-cards { display: flex; width: 100%; }
  .turn-area-option { flex: 1; min-width: 0; text-align: center; }
  .turn-area-option + .turn-area-option { margin-left: 14px; }
  .turn-area-card { width: 100%; padding: 0; font-family: inherit; }
  .turn-area-card[aria-pressed="true"] { border: 3px solid var(--fg); }
  .turn-area-diagram { display: flex; width: 60px; height: 28px; }
  .turn-area-diagram span { display: flex; flex: 1; align-items: center; justify-content: center; }
  .turn-area-diagram span + span { border-left: 1px solid var(--fg); }
  .turn-area-group + .other-setting-row { margin-top: 28px; }
  .other-setting-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .other-setting-toggle { position: relative; width: 58px; min-height: 32px; height: 32px; border: 2px solid var(--fg); border-radius: 16px; }
  .other-setting-toggle::after { content: ''; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); }
  .other-setting-toggle[aria-checked="true"] { background: var(--fg); }
  .other-setting-toggle[aria-checked="true"]::after { left: 30px; background: var(--bg); }
  .theme-segmented-group {
    display: flex;
    border: 1px solid var(--border);
  }
  .theme-segmented-btn {
    padding: 6px 12px;
    border: 0;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .theme-segmented-btn + .theme-segmented-btn {
    border-left: 1px solid var(--border);
  }
  .theme-segmented-btn.active {
    background: var(--fg);
    color: var(--bg);
  }
  .theme-segmented-btn svg {
    display: block;
    width: 20px;
    height: 20px;
  }
  .font-family-row {
    display: flex;
    margin: 16px 0 24px;
  }
  .font-radio-item {
    display: flex;
    align-items: center;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 16px;
    background: transparent;
    color: var(--fg);
  }
  .font-radio-item + .font-radio-item {
    margin-left: 32px;
  }
  .font-radio-item.active {
    font-weight: bold;
  }
  .font-radio-circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    margin-right: 12px;
  }
  .font-radio-item.active .font-radio-circle::after {
    content: '';
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--fg);
  }
  .stepper-row {
    display: flex;
    align-items: center;
    margin: 16px 0;
  }
  .stepper-label {
    font-size: 18px;
    width: 80px;
    flex-shrink: 0;
    color: var(--fg);
  }
  .stepper-controls {
    flex: 1;
    display: flex;
    align-items: center;
    margin-left: 12px;
    max-width: 560px;
  }
  .stepper-btn {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border: 0;
    background: transparent;
    color: var(--fg);
    font-size: 28px;
    line-height: 1;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .stepper-track-wrap {
    flex: 1;
    position: relative;
    height: 44px;
    display: flex;
    align-items: center;
    margin: 0 12px;
    cursor: pointer;
    touch-action: none;
  }
  .stepper-track-bg {
    position: absolute;
    left: 14px;
    right: 14px;
    height: 2px;
    background: var(--border);
  }
  .stepper-track-fill {
    position: absolute;
    left: 14px;
    height: 3px;
    background: var(--fg);
  }
  .stepper-thumb {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--fg);
    background: var(--bg);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .stepper-thumb-val {
    position: absolute;
    top: -22px;
    font-size: 15px;
    font-weight: bold;
    color: var(--fg);
  }
  .layout-options-row {
    display: flex;
    margin: 10px 0 16px;
  }
  .layout-opt-group {
    flex: 1;
  }
  .layout-opt-group + .layout-opt-group {
    margin-left: 36px;
  }
  .layout-opt-title {
    font-size: 17px;
    margin-bottom: 10px;
    color: var(--fg);
  }
  .layout-opt-cards {
    display: flex;
  }
  .layout-card {
    flex: 1;
    height: 52px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
  }
  .layout-card + .layout-card {
    margin-left: 14px;
  }
  .layout-card.active {
    border: 3px solid var(--fg) !important;
  }
  .layout-card svg {
    display: block;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="/eink/eink.js?v=42caf2d67aaa"></script>
</body>
</html>
