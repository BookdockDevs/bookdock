<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link id="bookdock-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <title>书坞</title>
    <script>
      (function () {
        try {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var favicon = document.getElementById('bookdock-favicon');
          if (favicon) favicon.href = dark ? '/favicon-dark.svg?v=3' : '/favicon.svg?v=7';
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background-color: #fafaf9; }
      html.dark, html.dark body { background-color: #0c0a09; }
      @media (prefers-color-scheme: dark) {
        html, body { background-color: #0c0a09; }
      }
      #bd-boot-loader {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      #bd-boot-loader-box {
        display: flex;
        height: 3rem;
        width: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background-color: #ffffff;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        color: #44403c;
      }
      html.dark #bd-boot-loader-box {
        background-color: #1c1917;
        color: #e7e5e4;
      }
      @media (prefers-color-scheme: dark) {
        #bd-boot-loader-box {
          background-color: #1c1917;
          color: #e7e5e4;
        }
      }
      #bd-boot-loader-svg {
        height: 1.5rem;
        width: 1.5rem;
        animation: bd-boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes bd-boot-pulse {
        50% { opacity: 0.5; }
      }
      @media (prefers-reduced-motion: reduce) {
        #bd-boot-loader-svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bd-boot-loader" role="status" aria-busy="true" aria-label="加载中…">
        <div id="bd-boot-loader-box" aria-hidden="true">
          <svg id="bd-boot-loader-svg" viewBox="0 0 32 32" fill="none">
            <path d="M13.7 3.4C13.5 2.5 14.5 2.0 15.3 2.6C21.8 7.1 25.4 12.6 25.0 19.3C25.0 20.1 24.3 20.7 23.5 20.6C19.5 19.6 15.5 19.8 11.6 20.7C10.8 20.8 10.3 20.1 10.6 19.3C12.6 14.4 13.7 8.9 13.7 3.4Z" fill="currentColor" />
            <path d="M2.0 23.6C7.3 22.1 11.9 21.6 16.0 21.6C20.1 21.6 24.7 22.1 30.0 23.6C30.7 23.8 31.0 24.5 30.5 25.0C27.7 26.9 22.0 27.3 16.9 28.3C16.3 28.4 15.7 28.4 15.1 28.3C10.0 27.3 4.3 26.9 1.5 25.0C1.0 24.5 1.3 23.8 2.0 23.6Z" fill="currentColor" opacity="0.74" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
