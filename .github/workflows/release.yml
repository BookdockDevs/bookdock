name: Release Bookdock

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.3.4
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const tag = process.env.RELEASE_TAG
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Unsupported release tag: ${tag}`)
          }

          const expectedVersion = tag.slice(1)
          const packageFiles = [
            'package.json',
            'apps/server/package.json',
            'apps/web/package.json',
            'packages/shared/package.json',
          ]
          const versions = packageFiles.map((file) => {
            const version = JSON.parse(readFileSync(file, 'utf8')).version
            console.log(`${file}: ${version}`)
            return version
          })

          if (versions.some((version) => version !== expectedVersion)) {
            throw new Error(`Package versions must all match ${expectedVersion}`)
          }
          NODE

      - name: Verify generated version info
        run: node scripts/sync-version.mjs --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Verify in-container update and rollback
        run: |
          docker build --tag bookdock:ci .
          node scripts/test-docker-update.mjs bookdock:ci

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/bookdock-release-notes.md
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const tag = process.env.RELEASE_TAG
          const version = tag.slice(1)
          const releaseDate = new Date().toISOString().slice(0, 10)
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/)
          const englishStart = lines.findIndex((line) => line.startsWith(`## [${version}]`))
          const chineseHeader = lines.findIndex((line) => line === '## 中文')
          const chineseStart = lines.findIndex(
            (line, index) => index > chineseHeader && line.startsWith(`### [${version}]`),
          )
          const englishEnd = lines.findIndex(
            (line, index) => index > englishStart && (line === '## 中文' || line.startsWith('## [')),
          )
          const chineseEnd = lines.findIndex(
            (line, index) => index > chineseStart && line.startsWith('### ['),
          )

          if (englishStart < 0 || chineseHeader < 0 || chineseStart < 0) {
            throw new Error(`Could not find bilingual changelog entry for ${tag}`)
          }

          const english = lines
            .slice(englishStart, englishEnd < 0 ? lines.length : englishEnd)
            .join('\n')
            .trim()
          const chinese = lines
            .slice(chineseStart, chineseEnd < 0 ? lines.length : chineseEnd)
            .join('\n')
            .trim()
          const normalizeReleaseHeading = (section) => section.replace(
            new RegExp(`^(#+\\s*\\[${escapedVersion}\\])\\s+-\\s+(?:Unreleased|待发布)\\s*$`, 'm'),
            `$1 - ${releaseDate}`,
          )
          writeFileSync(
            process.env.NOTES_FILE,
            `${normalizeReleaseHeading(english)}\n\n## 中文\n\n${normalizeReleaseHeading(chinese)}\n`,
          )
          NODE

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bookdock
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Second artifact line: the same app root as a zip the panel can download
      # and stage into DATA_DIR/releases (ADR-25). Built from the `bundle`
      # stage, so image and artifact cannot drift apart.
      - name: Export runtime bundle
        uses: docker/build-push-action@v7
        with:
          context: .
          target: bundle
          outputs: type=local,dest=${{ runner.temp }}/bundle

      - name: Package updater artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUNDLE_DIR: ${{ runner.temp }}/bundle
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="bookdock-${version}-linux-x64-musl.zip"
          mkdir -p "$ARTIFACT_DIR"
          # zip (not tar) because the extracting side is the running server, which
          # already depends on jszip; symlinks are dereferenced by default.
          (cd "$BUNDLE_DIR" && zip -qrX "$ARTIFACT_DIR/$archive" apps release.json)
          (cd "$ARTIFACT_DIR" && sha256sum "$archive" > "$archive.sha256")
          cp "$BUNDLE_DIR/release.json" "$ARTIFACT_DIR/release.json"
          cat "$ARTIFACT_DIR/$archive.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/bookdock-release-notes.md
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Bookdock $RELEASE_TAG" \
              --notes-file "$NOTES_FILE"
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --verify-tag
            --title "Bookdock $RELEASE_TAG"
            --notes-file "$NOTES_FILE"
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"

      # The updater resolves these by tag, so they must exist before a panel
      # can see the release.
      - name: Upload updater artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$ARTIFACT_DIR/release.json" \
            "$ARTIFACT_DIR"/bookdock-*.zip \
            "$ARTIFACT_DIR"/bookdock-*.zip.sha256 \
            --clobber
