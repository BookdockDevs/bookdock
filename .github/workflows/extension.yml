name: Browser extension

on:
  pull_request:
    paths:
      - 'apps/extension/**'
      - 'packages/shared/**'
      - 'apps/web/src/components/ui/**'
      - 'apps/web/src/features/library/**'
      - 'apps/web/src/hooks/useTranslation.ts'
      - 'apps/web/src/i18n/locales/zh-CN.json'
      - 'apps/web/src/lib/**'
      - 'apps/web/src/stores/toast.store.ts'
      - 'apps/web/src/styles/**'
      - 'apps/web/public/fonts/InterVariable.woff2'
      - 'apps/web/public/favicon.svg'
      - 'scripts/verify-extension-package.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/extension.yml'
  push:
    branches: [main]
    paths:
      - 'apps/extension/**'
      - 'packages/shared/**'
      - 'apps/web/src/components/ui/**'
      - 'apps/web/src/features/library/**'
      - 'apps/web/src/hooks/useTranslation.ts'
      - 'apps/web/src/i18n/locales/zh-CN.json'
      - 'apps/web/src/lib/**'
      - 'apps/web/src/stores/toast.store.ts'
      - 'apps/web/src/styles/**'
      - 'apps/web/public/fonts/InterVariable.woff2'
      - 'apps/web/public/favicon.svg'
      - 'scripts/verify-extension-package.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bookdock/extension typecheck
      - run: pnpm --filter @bookdock/extension test
      - run: pnpm build:extension
      - run: node scripts/verify-extension-package.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: bookdock-extension
          path: apps/extension/dist/*.zip
          if-no-files-found: error
