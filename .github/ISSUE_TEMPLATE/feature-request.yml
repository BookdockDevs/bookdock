name: "💡 功能建议 / Feature request"
description: 提议一个能让 Bookdock 更好的功能。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue，避免重复提出相同建议。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 这个功能要解决什么问题？使用场景是什么？
      placeholder: 当前需要……，因此……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案 / Proposed solution
      description: 请描述你希望 Bookdock 如何工作。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你是否尝试过其他解决方式？

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 可以附上截图、示意图、示例文件或其他信息。

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单 / Checklist
      options:
        - label: 我已经搜索过现有 Issue，确认没有重复建议。
          required: true
