name: "🐛 Bug 报告 / Bug report"
description: 报告一个可以复现的问题，帮助改进 Bookdock。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue，并确认问题在最新版本中仍然存在。

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清楚、简洁地描述发生了什么。
      placeholder: 例如：打开某本 EPUB 后，目录无法显示。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请提供可以稳定复现问题的步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你原本期望看到什么结果？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bookdock 版本 / Version
      description: 请填写实际使用的版本，例如 0.2.0。
      placeholder: 0.2.0
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式 / Deployment
      options:
        - Docker
        - Local development
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 请提供操作系统、浏览器及其他相关环境信息。
      placeholder: Windows 11, Chrome 140

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 如果有相关日志、截图或录屏，请附在这里。
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单 / Checklist
      options:
        - label: 我已经搜索过现有 Issue，确认没有重复报告。
          required: true
        - label: 我已经确认这个问题在最新版本中仍然存在。
          required: true
