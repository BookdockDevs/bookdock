services:
  bookdock:
    container_name: bookdock
    image: ${BOOKDOCK_IMAGE:-loofffff/bookdock:0.3.4}
    build:
      context: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data:/data
    # No environment block: NODE_ENV and DATA_DIR are set by the image, and all
    # other variables have working defaults (see docs/architecture.md, Config & Env).
    # Add overrides here when needed, e.g.:
    # environment:
    #   LOG_LEVEL: debug
