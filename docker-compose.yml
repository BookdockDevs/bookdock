services:
  bookdock:
    container_name: bookdock
    image: ${BOOKDOCK_IMAGE:-loofffff/bookdock:latest}
    build:
      context: .
    ports:
      - "18423:18423"
    restart: unless-stopped
    volumes:
      - ./data:/data
    # No environment block: NODE_ENV, DATA_DIR, and PORT are set by the image, and all
    # other variables have working defaults (see docs/architecture.md, Config & Env).
    # Add overrides here when needed, e.g.:
    # environment:
    #   LOG_LEVEL: debug
